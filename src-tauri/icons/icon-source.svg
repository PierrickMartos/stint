<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Stint app icon — "05 Concentric" from the Stint Icons design exploration.
    Two nested countdown arcs (outer 33%, inner 60%, both from 12 o'clock) with
    a center dot, indigo gradient on the deep Direction-B surface.
    Artwork occupies 824/1024 (the macOS Big Sur+ icon grid) so the squircle
    sits at standard dock size next to other apps.
  -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#21212c"/>
      <stop offset="60%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#0c0c10"/>
    </radialGradient>
    <linearGradient id="ind" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A6B2FF"/>
      <stop offset="100%" stop-color="#7682F2"/>
    </linearGradient>
    <clipPath id="clip"><rect x="0" y="0" width="512" height="512" rx="120" ry="120"/></clipPath>
  </defs>

  <g transform="translate(100 100) scale(1.609375)">
    <g clip-path="url(#clip)">
      <rect width="512" height="512" rx="120" fill="url(#bg)"/>

      <!-- outer arc: track + 33% sweep from 12 o'clock -->
      <circle cx="256" cy="256" r="158" fill="none" stroke="rgba(233,232,239,0.12)" stroke-width="10"/>
      <circle cx="256" cy="256" r="158" fill="none" stroke="url(#ind)" stroke-width="10"
        stroke-linecap="round" stroke-dasharray="327.6055 665.1383" transform="rotate(-90 256 256)"/>

      <!-- inner arc: track + 60% sweep from 12 o'clock -->
      <circle cx="256" cy="256" r="116" fill="none" stroke="rgba(233,232,239,0.12)" stroke-width="10"/>
      <circle cx="256" cy="256" r="116" fill="none" stroke="url(#ind)" stroke-width="10"
        stroke-linecap="round" stroke-dasharray="437.3097 291.5398" transform="rotate(-90 256 256)"/>

      <!-- center dot -->
      <circle cx="256" cy="256" r="9" fill="url(#ind)"/>
    </g>
    <!-- hairline edge highlight -->
    <rect x="0.5" y="0.5" width="511" height="511" rx="119.5" fill="none" stroke="rgba(255,255,255,0.06)"/>
  </g>
</svg>
