# Release pipeline: push a tag like `v0.1.0` (matching the version in
# src-tauri/tauri.conf.json) and this builds a universal macOS bundle
# (Apple Silicon + Intel) and publishes the .dmg to a GitHub Release.
#
# The install script (scripts/install.sh) and the README's download links
# both point at the latest release produced here.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Stint ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version. Or run the [install one-liner](https://github.com/PierrickMartos/stint#install) — it always fetches the latest release.'
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
